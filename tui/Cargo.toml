[package]
name = "acct-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal chat UI for the local accounting agent (acct-agent)"
license = "MIT"

[[bin]]
name = "acct-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
